<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Bound · Transmutador · Prueba visual</title><style>body{margin:0;background:#101914;color:#e9f3df;font:16px system-ui}header{padding:16px}button{padding:12px 18px;background:#8ad244;border:0;border-radius:8px;font-weight:bold;cursor:pointer}iframe{border:0;width:100%;height:86vh}#status{display:inline;margin-left:16px}</style><header><button id="open">Abrir prueba del Transmutador</button><span id="status">Cargando el motor original…</span></header><iframe id="game" src="test.html"></iframe><script>
