<!doctype html><html><body style="margin:0;background:#4a8e34">
<canvas id="c" style="image-rendering:pixelated"></canvas>
<script src="../src/00_core.js"></script><script src="../src/10_world.js"></script><script src="../src/20_terrain.js"></script>
<script src="../src/30_art_env.js"></script><script src="../src/31_art_build.js"></script><script src="../src/32_art_chars.js"></script>
<script>
const q=new URLSearchParams(location.search); const Z=+(q.get('z')||8);
const looks=(q.get('cls')||'guerrero').split(',').map(k=>buildAtlas(classLook(k,{skin:+(q.get('skin')||0),hair:q.get('hair')||'negro',style:q.get('style')||'long',eyes:'rojo'},+(q.get('tier')||1),3)));
const frames=(q.get('f')||'0').split(',').map(Number);
const c=document.getElementById('c'); const a0=looks[0]; c.width=a0.fw*4*frames.length; c.height=a0.fh*looks.length; c.style.width=c.width*Z+'px'; c.style.height=c.height*Z+'px';
const x=c.getContext('2d'); let col=0;
looks.forEach((a,li)=>{ let col=0; for(const fr of frames) for(let d=0;d<4;d++){ x.drawImage(a.img,fr*a.fw,d*a.fh,a.fw,a.fh,col*a.fw,li*a.fh,a.fw,a.fh); col++; } });
</script></body></html>
