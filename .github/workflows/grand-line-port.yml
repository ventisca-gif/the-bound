name: Test Grand Line port
on:
  pull_request:
    branches: [main]
    paths: ['src/6zzzzzzz_v66*_*.js', 'tests/grandline664/**', '.github/workflows/grand-line-port.yml']
permissions:
  contents: write
jobs:
  native-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test dependencies
        run: |
          pip install playwright
          mkdir -p tools/i18n/vendor
          npm pack acorn@8.14.0
          tar -xOzf acorn-8.14.0.tgz package/dist/acorn.js > tools/i18n/vendor/acorn.js
      - run: python3 build.py
      - run: python3 -u tests/grandline664/browser.py "file://$PWD/dist/test.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-line-gameplay
          path: tests/grandline664/out/*.png

      - name: Save verified update on the release branch
        if: github.event.pull_request.head.ref == 'codex/puerto-de-las-campanas' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 tools/dev/release.py --no-build
          git fetch --depth 1 origin main
          test "$(git rev-parse FETCH_HEAD)" = ad9127c0a51c211453e321ace3afa6967f490636
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/thebound.html update/thebound.html.gz update/version.json
          git commit -m 'Package verified Bellhaven update'
          git push origin HEAD:refs/heads/codex/puerto-de-las-campanas
