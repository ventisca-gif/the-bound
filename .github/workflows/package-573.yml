name: Package The Bound 5.73
on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: ['.github/workflows/package-573.yml']
permissions: {}
jobs:
  package:
    if: github.actor == 'ventisca-gif' && github.event.pull_request.number == 180 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/dawn-lock-573'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify the approved package
        run: |
          mkdir -p tools/i18n/vendor
          npm pack acorn@8.14.0 --pack-destination /tmp
          tar -xOzf /tmp/acorn-8.14.0.tgz package/dist/acorn.js > tools/i18n/vendor/acorn.js
          python3 tools/dev/release.py
          python3 -c "import json,hashlib,pathlib; j=json.load(open('update/version.json')); sha=hashlib.sha256(pathlib.Path('update/thebound.html').read_bytes()).hexdigest(); assert (j['build'],j['ver'],j['sha256'],sha)==(194,'5.73','976356b90bfcfe6e6ee054b8730133bbe01fd5d46258cafe9737a73d568c65f5','976356b90bfcfe6e6ee054b8730133bbe01fd5d46258cafe9737a73d568c65f5')"
      - name: Commit the two updater files to the PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin refs/heads/codex/dawn-lock-573
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/thebound.html update/version.json
          git commit -m 'Package verified The Bound 5.73 updater'
          git push origin HEAD:refs/heads/codex/dawn-lock-573
