name: Package The Bound 5.68
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths: ['.github/workflows/package-568.yml']
permissions:
  contents: write
jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/selva-peruana'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate and verify the 5.68 package
        run: |
          mkdir -p tools/i18n/vendor
          npm pack acorn@8.14.0 --pack-destination /tmp
          tar -xOzf /tmp/acorn-8.14.0.tgz package/dist/acorn.js > tools/i18n/vendor/acorn.js
          python3 tools/dev/release.py
          python3 -c "import json; j=json.load(open('update/version.json')); assert (j['build'], j['ver'], j['sha256']) == (189, '5.68', '6541018e19547f209d8b5f37cc091f29fbfd96b4f9b26024773f49aae56aeecf')"
      - name: Add the verified package to this pull request
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin refs/heads/codex/selva-peruana
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/thebound.html update/version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Package verified The Bound 5.68 updater'
          git push origin HEAD:refs/heads/codex/selva-peruana
