name: Validate Ado idol, romance, children and native hairstyles
on:
  pull_request:
    paths: ['src/**','template.html','tests/ado/**','.github/workflows/ado.yml']
permissions:
  contents: write
concurrency:
  group: ado-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'codex/ado-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          pip install playwright pillow
          mkdir -p tools/i18n/vendor
          npm pack acorn@8.14.0
          tar -xzf acorn-8.14.0.tgz package/dist/acorn.js
          cp package/dist/acorn.js tools/i18n/vendor/acorn.js
      - run: python3 build.py
      - name: Exercise Ado, Miku, Teto, children and hairstyles; capture actual game
        run: python3 tests/ado/browser.py
      - name: Regress existing hairstyles, gi, creatures and network appearance
        run: |
          python3 tests/hair8/browser.py
          python3 tests/gi/browser.py
          python3 tests/r133/browser.py
          python3 tests/r143/browser.py
          python3 tests/net501/browser.py > /tmp/ado-network.json
      - name: Check all outfits and bodies
        run: python3 tools/dev/fitcheck.py file://$PWD/dist/test.html /tmp/ado-fit --strict
      - name: Verify internal updater
        run: python3 tests/upd.py file://$PWD/dist/test.html /tmp/ado-updater.png > /tmp/ado-updater.log
      - name: Package verified update
        run: python3 tools/dev/release.py --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ado-validation
          path: |
            update/*
            tests/ado/out/*
            /tmp/ado-fit/fit_report.txt
            /tmp/ado-network.json
            /tmp/ado-updater.log
      - name: Commit verified package
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/thebound.html update/version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Package verified Ado update'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
