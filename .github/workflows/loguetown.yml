name: Validate and package Loguetown
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'template.html', 'tests/loguetown/**', '.github/workflows/loguetown.yml']
permissions:
  contents: write
concurrency:
  group: loguetown-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/loguetown-island'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and browser dependencies
        run: |
          pip install playwright pillow
          mkdir -p tools/i18n/vendor
          npm pack acorn@8.14.0
          tar -xOzf acorn-8.14.0.tgz package/dist/acorn.js > tools/i18n/vendor/acorn.js
      - run: python3 build.py
      - name: Verify island paths, sailing and native rendering
        run: python3 tests/loguetown/browser.py
      - name: Regression suite and outfit fit
        run: |
          mkdir -p /tmp/logue-reg
          bash tools/dev/reg.sh /tmp/logue-reg > /tmp/logue-regression.log 2>&1
          cat /tmp/logue-regression.log
          if grep -E 'PAGEERROR|Traceback|AVISO: envolturas nuevas' /tmp/logue-regression.log; then exit 1; fi
      - name: Verify updater and older saves
        run: |
          python3 tests/upd.py file://$PWD/dist/test.html /tmp/logue-updater.png > /tmp/logue-updater.log
          python3 tests/saves.py file://$PWD/dist/test.html > /tmp/logue-saves.log
          cat /tmp/logue-updater.log /tmp/logue-saves.log
      - name: Verify map interactions
        run: python3 tests/xact_sitio.py file://$PWD/dist/test.html > /tmp/logue-interactions.log
      - name: Package verified update
        run: python3 tools/dev/release.py --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loguetown-validation
          path: |
            tests/loguetown/out/*
            /tmp/logue-*.log
            /tmp/logue-reg/fit/fit_report.txt
            update/version.json
      - name: Commit verified updater package
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/thebound.html update/version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Package verified Loguetown update'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
