name: Review current equipped armor
on:
  pull_request:
    paths:
      - 'tests/armor_review/**'
      - '.github/workflows/armor-review.yml'
permissions:
  contents: read
jobs:
  review:
    if: github.event.pull_request.head.ref == 'codex/armaduras-muestra' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python3 tests/armor_review/review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipped-armor-review
          path: tests/armor_review/out/*
