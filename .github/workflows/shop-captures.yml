name: Capture published comic shop
on:
  pull_request:
    paths:
      - 'tests/gi/capture_shop.py'
      - '.github/workflows/shop-captures.yml'
permissions:
  contents: read
jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/capturas-tendero-akihabara'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python3 tests/gi/capture_shop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tendero-capturas
          path: shop-captures/*.png
