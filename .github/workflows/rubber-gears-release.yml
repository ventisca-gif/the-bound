name: Build Rubber Gears release
on:
  push:
    branches: [release/rubber-gears-675]
    paths: ['.github/workflows/rubber-gears-release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build updater
        run: |
          mkdir -p tools/i18n/vendor
          npm pack acorn@8.14.0 --pack-destination /tmp
          tar -xOzf /tmp/acorn-8.14.0.tgz package/dist/acorn.js > tools/i18n/vendor/acorn.js
          python3 tools/dev/release.py
      - name: Commit updater to release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update/thebound.html update/thebound.html.gz update/version.json
          git commit -m 'Build The Bound 6.75 updater'
          git push origin HEAD:refs/heads/release/rubber-gears-675
